[project]
name = "ai2-kit"
version = "2.0.0"
description = ""
authors = [{name = "weihong.xu", email = "xuweihong.cn@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fire>=0.7.1,<0.8",
    "pydantic>=2.12.0,<3",
    "ruamel-yaml>=0.17.21,<0.18",
    "shortuuid>=1.0.11,<2",
    "dpdata>=1.1.0",
    "deepmd-kit>2,<4",
    "pandas>=2.2.3,<3",
    # DScribe 2.1.2 uses the Atoms positional constructor changed in ASE 3.27.
    "ase>=3.26,<3.27",
    "mdanalysis>=2.9,<3.0",
    "tabulate>=0.9.0,<0.10",
    "joblib>=1.2.0,<2",
    "scipy>=1.13.0,<2",
    "psutil>=5.9.8,<6",
    "numpy>=2.0,<3.0",
    "netcdf4>=1.7.1.post1,<2",
    "scikit-learn>=1.6.1,<2",
    "oh-my-batch>=0.7.7",
    "dscribe>=2.1.2",
]

[project.optional-dependencies]
all = ["fire-rpc>=0.1.4", "cp2kdata>=0.7.3,<0.8"]
cp2kdata = ["cp2kdata>=0.7.3,<0.8"]
rpc = ["fire-rpc>=0.1.4"]

[dependency-groups]
dev = ["autopep8>=2.0.0,<3", "pytest>=8.4.2,<9"]
doc = ["jupyter-book>=0.15.1,<0.16"]

[tool.uv]
# cp2k-input-tools needs Pint 0.26 on Python >=3.12, while mendeleev caps it at 0.25.
# Keep Pint 0.24.4 on older Python versions. Overrides apply only to uv project
# environments, not to published package metadata or pip installations.
# https://github.com/robinzyb/cp2kdata/issues/101
override-dependencies = [
    "pint>=0.24.4,<0.25; python_version < '3.12'",
    "pint>=0.26,<0.27; python_version >= '3.12'",
]

[tool.uv.build-backend]
module-name = "ai2_kit"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[project.scripts]
ai2-kit = "ai2_kit.main:main"
ai2-kit-rpc = "ai2_kit.main:rpc_main"
ai2-spectr = "ai2_kit.feat.spectrum:cli_main"

[tool.ruff]
preview = true
line-length = 120

[tool.ruff.lint]
explicit-preview-rules = true
ignore = ["E741", "F541", "F841"]
extend-select = ["PLR1704"]
