name: Run Tests

on:
  push:
    branches: [ "main", "v2-breaking" ]
  pull_request:
    branches: [ "main", "v2-breaking" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: ${{ github.ref == 'refs/heads/v2-breaking' || github.base_ref == 'v2-breaking' }}

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.11.28"
        enable-cache: true

    - name: Install dependencies
      run: |
        # pycp2k only publishes an sdist; require wheels for all other dependencies.
        uv sync --locked --no-build --no-install-project --no-install-package pycp2k --extra cp2kdata
        uv sync --locked --extra cp2kdata

    - name: Run tests with pytest
      run: |
        uv run --no-sync python -m pytest tests --ignore=tests/test_md_spectra.py -k 'not DPFFDPData'
